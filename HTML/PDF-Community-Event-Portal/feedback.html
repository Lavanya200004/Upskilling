<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Feedback</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark site-nav">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html#home">
          <i class="bi bi-calendar-event"></i> City Events
        </a>
        <div class="d-flex flex-column flex-md-row gap-3">
          <a href="index.html#home">Home</a>
          <a href="index.html#events">Events</a>
          <a href="index.html#contact">Contact</a>
        </div>
      </div>
    </nav>

    <!-- Main -->
    <main class="container">
      <section class="content-section form-section mx-auto">
        <h1 class="h2">Event Feedback with Events Handling</h1>
        <form class="row g-3">
          <div class="col-12">
            <label class="form-label" for="phone">Phone Number</label>
            <input
              class="form-control"
              type="text"
              id="phone"
              placeholder="Enter 10-digit phone number"
              onblur="validatePhone()"
              required
            />
            <p id="phoneMessage"></p>
          </div>

          <div class="col-12">
            <label class="form-label" for="event">Select Event</label>
            <select
              class="form-select"
              id="event"
              onchange="showFee(); savePreference();"
            >
              <option value="">Choose Event</option>
              <option>Tech Workshop</option>
              <option>Music Night</option>
              <option>Community Play Day</option>
              <option>Sports Tournament</option>
              <option>Art Exhibition</option>
              <option>Coding Competition</option>
            </select>
            <p id="fee"></p>
          </div>

          <div class="col-12">
            <label class="form-label" for="feedback">Feedback</label>
            <textarea
              class="form-control"
              id="feedback"
              placeholder="Write your feedback"
              onkeydown="countCharacters()"
            ></textarea>
            <p id="count">Characters: 0</p>
          </div>

          <div class="col-12">
            <div class="btn-group" role="group">
              <button
                class="btn btn-primary"
                type="button"
                onclick="confirmSubmit()"
              >
                Submit
              </button>
              <button
                class="btn btn-outline-danger"
                type="button"
                onclick="clearPreferences()"
              >
                Clear Preferences
              </button>
            </div>
          </div>
        </form>
      </section>
    </main>

    <!-- Footer -->
    <footer class="position-fixed bottom-0 start-0 end-0 bg-dark text-white text-center py-2">
      All rights reserved
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      let hasUnfinishedChanges = false;

      function validatePhone() {
        const number = document.querySelector("#phone").value;
        const isValid = /^[0-9]{10}$/.test(number);

        document.querySelector("#phoneMessage").textContent = isValid
          ? "Valid Phone Number"
          : "Enter a valid 10-digit phone number";
      }

      function countCharacters() {
        setTimeout(function () {
          const text = document.querySelector("#feedback").value;
          hasUnfinishedChanges = text.length > 0;
          document.querySelector("#count").textContent =
            "Characters: " + text.length;
        }, 0);
      }

      function showFee() {
        const selectedEvent = document.querySelector("#event").value;
        const fees = {
          "Tech Workshop": "Fee: Rs. 500",
          "Music Night": "Fee: Rs. 300",
          "Community Play Day": "Fee: Rs. 200",
          "Sports Tournament": "Fee: Rs. 400",
          "Art Exhibition": "Fee: Rs. 250",
          "Coding Competition": "Fee: Rs. 350",
        };

        document.querySelector("#fee").textContent = fees[selectedEvent] || "";
      }

      function savePreference() {
        const selected = document.querySelector("#event").value;
        localStorage.setItem("event", selected);
        sessionStorage.setItem("lastVisitedForm", "feedback");
      }

      function clearPreferences() {
        localStorage.clear();
        sessionStorage.clear();
        document.querySelector("#event").value = "";
        document.querySelector("#fee").textContent = "";
        alert("Preferences cleared");
      }

      function confirmSubmit() {
        hasUnfinishedChanges = false;
        alert("Feedback Submitted Successfully!");
      }

      window.onload = function () {
        const saved = localStorage.getItem("event");

        if (saved) {
          document.querySelector("#event").value = saved;
          showFee();
        }
      };

      window.onbeforeunload = function () {
        if (hasUnfinishedChanges) {
          return "You have unfinished changes!";
        }
      };
    </script>
  </body>
</html>
