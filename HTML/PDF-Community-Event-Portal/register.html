<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register for Event</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark site-nav">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html#home">
          <i class="bi bi-calendar-event"></i> City Events
        </a>
        <div class="d-flex flex-column flex-md-row gap-3">
          <a href="index.html#home">Home</a>
          <a href="index.html#events">Events</a>
          <a href="index.html#contact">Contact</a>
        </div>
      </div>
    </nav>

    <!-- Main -->
    <main class="container">
      <section class="content-section form-section mx-auto">
        <h1 class="h2">Event Registration Form</h1>
        <form id="registrationForm" class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="fullName">Name</label>
            <input
              class="form-control"
              id="fullName"
              name="fullName"
              type="text"
              placeholder="Enter your name"
              required
              autofocus
            />
          </div>

          <div class="col-md-6">
            <label class="form-label" for="email">Email</label>
            <input
              class="form-control"
              id="email"
              name="email"
              type="email"
              placeholder="Enter email"
              required
            />
          </div>

          <div class="col-md-6">
            <label class="form-label" for="eventDate">Event Date</label>
            <input
              class="form-control"
              id="eventDate"
              name="eventDate"
              type="date"
              required
            />
          </div>

          <div class="col-md-6">
            <label class="form-label" for="eventType">Event Type</label>
            <select class="form-select" id="eventType" name="eventType" required>
              <option value="">Choose Event</option>
              <option>Tech Workshop</option>
              <option>Music Night</option>
              <option>Community Play Day</option>
              <option>Sports Tournament</option>
              <option>Art Exhibition</option>
              <option>Coding Competition</option>
            </select>
          </div>

          <div class="col-12">
            <label class="form-label" for="messageText">Message</label>
            <textarea
              class="form-control"
              id="messageText"
              name="messageText"
              placeholder="Add extra details"
            ></textarea>
          </div>

          <div class="col-12">
            <div class="input-group">
              <span class="input-group-text">Code</span>
              <input
                class="form-control"
                type="text"
                value="CITY2026"
                aria-label="Registration code"
                readonly
              />
            </div>
          </div>

          <div class="col-12 d-flex gap-2">
            <button id="registerBtn" class="btn btn-primary" type="submit">
              <i class="bi bi-check-circle"></i> Submit
            </button>
            <a class="btn btn-outline-secondary" href="feedback.html">
              Feedback
            </a>
          </div>

          <div class="col-12">
            <output id="confirmation"></output>
            <p id="registrationResult"></p>
          </div>
        </form>
      </section>
    </main>

    <!-- Footer -->
    <footer class="position-fixed bottom-0 start-0 end-0 bg-dark text-white text-center py-2">
      All rights reserved
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const form = document.querySelector("#registrationForm");
      const confirmation = document.querySelector("#confirmation");
      let hasUnfinishedChanges = false;

      form.addEventListener("input", function () {
        hasUnfinishedChanges = true;
      });

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        console.log("Form submission started");

        const name = form.elements.fullName.value.trim();
        const email = form.elements.email.value.trim();
        const selectedEvent = form.elements.eventType.value;

        if (!name || !email || !selectedEvent) {
          document.querySelector("#registrationResult").textContent =
            "Please fill all required fields.";
          return;
        }

        confirmation.value = `Registration Successful for ${name}`;

        const payload = { name, email, selectedEvent };
        console.log("Fetch request payload", payload);

        await new Promise((resolve) => setTimeout(resolve, 800));
        document.querySelector("#registrationResult").textContent =
          "Success: registration sent to mock API.";
        hasUnfinishedChanges = false;
      });

      if (window.jQuery) {
        $("#registerBtn").click(function () {
          $("#confirmation").fadeIn();
        });
      }

      window.onbeforeunload = function () {
        if (hasUnfinishedChanges) {
          return "You have unfinished changes!";
        }
      };
    </script>
  </body>
</html>
